name: Build V8 Bytecode

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.0)'
        required: true

jobs:
  build-jsc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Build bytecode
        run: node build.mjs --jsc
        env:
          BUILD_JSC: '1'

      - name: Get tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package .jsc
        run: |
          cd dist
          tar czf "../kiroku-${{ steps.tag.outputs.value }}-node${{ matrix.node }}.tar.gz" \
            cli.jsc proxy.jsc worker.jsc mcp.jsc

      - uses: actions/upload-artifact@v4
        with:
          name: jsc-node${{ matrix.node }}
          path: kiroku-*.tar.gz

  publish-release:
    needs: build-jsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          gh release create "$TAG" \
            --repo yelban/kiroku-public \
            --title "$TAG" \
            --notes "Bytecode release for $TAG" \
            kiroku-*.tar.gz 2>/dev/null || \
          gh release upload "$TAG" \
            --repo yelban/kiroku-public \
            --clobber \
            kiroku-*.tar.gz
